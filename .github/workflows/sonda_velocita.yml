name: Sonda velocita (temporaneo)
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.11' }
    - run: pip install -q omfiles fsspec s3fs requests numpy
    - run: python strumenti/sonda_velocita.py
