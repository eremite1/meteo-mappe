name: Genera Mappe Meteo Native (Parallelo)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests numpy matplotlib cartopy scipy

    - name: Run native weather generation script
      run: python genera_mappe_native.py

    - name: Commit and push generated maps
      run: |
        git config --global user.name 'actions-user'
        git config --global user.email 'actions@github.com'
        git add mappe_native/
        git commit -m "Aggiornamento mappe ad alta definizione [skip ci]" || exit 0
        git push
