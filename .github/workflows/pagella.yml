name: Pagella Mappe Lazio

# Confronta le previsioni delle Mappe Lazio (tutti i modelli) con le stazioni meteo reali.
# Parte dopo ogni pubblicazione delle mappe e comunque ogni 3 ore.
# Risultato nel ramo "pagella": pagella.json (letto dal sito) e lo storico delle previsioni nei punti.
on:
  workflow_run:
    workflows: ["Mappe meteo", "Multimodello"]
    types: [completed]
  schedule:
    - cron: '41 * * * *'   # ogni ora (GitHub a volte salta gli avvii a orario)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pagella-mappe
  cancel-in-progress: false

jobs:
  pagella:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -q numpy requests matplotlib scipy

    - name: Osservazioni delle stazioni (raccolte dalla pagella di WRF Nerola)
      run: |
        curl -fsSL --retry 4 -o osservazioni.csv "https://raw.githubusercontent.com/eremite1/wrf-nerola/storico/osservazioni.csv"
        wc -l osservazioni.csv

    - name: Radar come pluviometri virtuali e WRF Nerola negli stessi punti (dal nowcasting)
      run: |
        mkdir -p punti
        curl -fsSL --retry 4 -o radar_punti.csv "https://raw.githubusercontent.com/eremite1/nowcasting-nerola/risultati/radar_punti.csv" \
          && wc -l radar_punti.csv || { echo "radar nei punti non ancora disponibile"; rm -f radar_punti.csv; }
        curl -fsSL --retry 4 -o radar_orario.npz "https://raw.githubusercontent.com/eremite1/nowcasting-nerola/risultati/radar_orario.npz" \
          || { echo "radar orario non ancora disponibile"; rm -f radar_orario.npz; }

    - name: WRF Nerola (3 km e 1 km), ultima corsa pubblicata
      run: |
        mkdir -p wrf
        for d in d01 d02; do
          curl -fsSL --retry 4 -o wrf/${d}_tutto.npz "https://raw.githubusercontent.com/eremite1/wrf-nerola/risultati/${d}_tutto.npz" \
            || { echo "WRF $d non disponibile"; rm -f wrf/${d}_tutto.npz; }
        done
        # altre catene del WRF (333 m su Nerola, WRF su dati GFS): entrano in pagella da sole quando sono pubblicate
        U=https://raw.githubusercontent.com/eremite1/wrf-nerola/risultati
        curl -fsSL --retry 3 -o wrf/fine_d03.npz "$U/fine/d03_tutto.npz" || rm -f wrf/fine_d03.npz
        curl -fsSL --retry 3 -o wrf/gfs_d01.npz "$U/gfs/d01_tutto.npz" || rm -f wrf/gfs_d01.npz
        curl -fsSL --retry 3 -o wrf/gfs_d02.npz "$U/gfs/d02_tutto.npz" || rm -f wrf/gfs_d02.npz
        # varianti di fisica (ramo "fisica" di wrf-nerola)
        F=https://raw.githubusercontent.com/eremite1/wrf-nerola/fisica
        mkdir -p wrf/fisica
        for f in $(curl -fsSL "$F/indice.json" 2>/dev/null | python3 -c "import json,sys;print(' '.join(json.load(sys.stdin).get('file',[])))" 2>/dev/null); do
          curl -fsSL --retry 3 -o "wrf/fisica/$f" "$F/$f" || rm -f "wrf/fisica/$f"
        done
        for c in iconeu icon2i; do for d in d01 d02; do
          curl -fsSL --retry 3 -o "wrf/${c}_${d}.npz" "$U/$c/${d}_tutto.npz" || rm -f "wrf/${c}_${d}.npz"
        done; done
        ls -la wrf
        if [ -f wrf/d01_tutto.npz ]; then
          python - <<'PY'
        import csv
        from motore import verifica as V
        st = {}
        for r in csv.DictReader(open("osservazioni.csv", newline="", encoding="utf-8")):
            st[r["id"]] = (r["id"], float(r["lat"]), float(r["lon"]))
        if __import__("os").path.exists("radar_punti.csv"):
            for r in csv.DictReader(open("radar_punti.csv", newline="")):
                st.setdefault(r["id"], (r["id"], float(r["lat"]), float(r["lon"])))
        altri = [("wrf333m", "wrf/fine_d03.npz"), ("wrfgfs3km", "wrf/gfs_d01.npz"), ("wrfgfs1km", "wrf/gfs_d02.npz"),
                 ("wrficoneu3km", "wrf/iconeu_d01.npz"), ("wrficoneu1km", "wrf/iconeu_d02.npz"),
                 ("wrficon2i3km", "wrf/icon2i_d01.npz"), ("wrficon2i1km", "wrf/icon2i_d02.npz")]
        import glob, os
        altri += [("fis_" + os.path.basename(f)[:-4], f) for f in sorted(glob.glob("wrf/fisica/*.npz"))]
        out = V.wrf_punti("wrf/d01_tutto.npz", "wrf/d02_tutto.npz", list(st.values()), "punti", altri)
        print("WRF nei punti:", {k: str(v) for k, v in out.items()})
        PY
        fi

    - name: Previsioni nei punti delle stazioni (ultima corsa di ogni modello e del multimodello)
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        REMOTO="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
        mkdir -p punti
        prendi() {   # ramo, file nel ramo, chiave nello storico
          if git show "FETCH_HEAD:$2" > "punti/$3.csv" 2>/dev/null; then echo "$3: $(wc -l < punti/$3.csv) righe"; else rm -f "punti/$3.csv"; fi
        }
        # tutti i modelli delle Mappe Lazio (ogni ramo mappe-*): un modello nuovo entra da solo
        MODELLI=$(git ls-remote --heads "$REMOTO" 'mappe-*' | sed 's|.*refs/heads/mappe-||' | tr '\n' ' ')
        echo "modelli trovati: $MODELLI"
        for m in $MODELLI; do
          git fetch -q --depth 1 "$REMOTO" "mappe-$m" 2>/dev/null || { echo "$m: ramo assente"; continue; }
          git show "FETCH_HEAD:griglia_lazio.npz" > "griglie_$m.npz" 2>/dev/null || rm -f "griglie_$m.npz"
          if [ "$m" = multi ]; then
            prendi mappe-multi punti_lazio.csv multi
            prendi mappe-multi punti_lazio_uguali.csv media
            prendi mappe-multi punti_italia.csv multi@italia
            prendi mappe-multi punti_italia_uguali.csv media@italia
          else
            prendi mappe-$m punti_lazio.csv $m
            prendi mappe-$m punti_italia.csv $m@italia
          fi
        done

    - name: Storico e calcolo della pagella
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        REMOTO="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
        RAMO="$RUNNER_TEMP/pagella"
        mkdir -p "$RAMO"
        if git fetch -q --depth 1 "$REMOTO" pagella 2>/dev/null; then
          git archive FETCH_HEAD | tar -x -C "$RAMO"
        fi
        ARG=""
        for f in punti/*.csv; do [ -e "$f" ] && ARG="$ARG $(basename "$f" .csv)=$f"; done
        echo "file: $ARG"
        RADAR=""; [ -f radar_punti.csv ] && RADAR="--radar radar_punti.csv"
        python -m motore.pagella --storico "$RAMO" --osservazioni osservazioni.csv --punti $ARG $RADAR 2>&1 | tee registro.txt
        sed 's/^/::notice::/' registro.txt | tail -6
        # pagella unica: mappe di pioggia di tutti i modelli contro il radar, piu' il riepilogo per la pagina
        G=""; for f in griglie_*.npz; do [ -e "$f" ] && G="$G $(basename "$f" .npz | sed 's/^griglie_//')=$f"; done
        W=""; [ -f wrf/d01_tutto.npz ] && W="--wrf wrf/d01_tutto.npz wrf/d02_tutto.npz"
        A=""; for kv in wrf333m=wrf/fine_d03.npz wrfgfs3km=wrf/gfs_d01.npz wrfgfs1km=wrf/gfs_d02.npz wrficoneu3km=wrf/iconeu_d01.npz wrficoneu1km=wrf/iconeu_d02.npz wrficon2i3km=wrf/icon2i_d01.npz wrficon2i1km=wrf/icon2i_d02.npz; do [ -f "${kv#*=}" ] && A="$A $kv"; done
        [ -n "$A" ] && W="$W --wrf-altri $A"
        R=""; [ -f radar_orario.npz ] && R="--radar radar_orario.npz"
        python -m motore.verifica --storico "$RAMO" $R --griglie $G $W 2>&1 | tee -a registro.txt
        cd "$RAMO"
        git init -q -b pagella
        git config user.name 'actions-user'
        git config user.email 'actions@github.com'
        git add -A
        git commit -q -m "Pagella $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
        git push -q -f "$REMOTO" pagella
