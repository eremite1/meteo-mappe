# PROVA della carta sinottica analizzata: solo quel parametro, ECMWF Europa, prime ore. Le immagini vanno nel
# ramo "prova-sinottica" per poterle controllare. Si avvia a mano.
name: "Prova carta sinottica"
on:
  workflow_dispatch:
    inputs:
      ore:
        description: 'Ore di previsione'
        default: '24'
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements-mappe.txt
    - run: pip install -q -r requirements-mappe.txt
    - uses: actions/cache@v4
      with:
        path: ~/.local/share/cartopy
        key: cartopy-naturalearth-v2
    - name: Genera
      env:
        FORZA: 'true'
        SOLO_PARAMETRI: sinottica
      run: python -m motore.genera ecmwf europa ${{ github.event.inputs.ore }} 2>&1 | tail -40
    - name: Pubblica nel ramo prova-sinottica
      run: |
        mkdir -p /tmp/p && cp uscita/europa/sinottica_* /tmp/p/ 2>/dev/null; ls /tmp/p | head
        cd /tmp/p && git init -q -b prova-sinottica && git add -A && git -c user.name=bot -c user.email=bot@x commit -q -m prova
        git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" prova-sinottica
