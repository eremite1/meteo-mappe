name: Sonda fonti dati (temporaneo)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.11' }
    - run: pip install -q omfiles fsspec s3fs requests numpy
    - run: python strumenti/sonda_campioni.py
    - name: Pubblica campioni
      run: |
        cd campioni
        git init -q -b campioni
        git -c user.name=a -c user.email=a@a add -A
        git -c user.name=a -c user.email=a@a commit -q -m campioni
        git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" campioni
        du -sh .
