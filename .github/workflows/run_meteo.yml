name: Genera Archivio Meteo Completo

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib numpy shapely pyshp cartopy

      - name: Esegui script generazione archivio
        run: python genera_mappe.py

      - name: Salva mappa su GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add mappe_output/mappa_lazio_cartopy.png
          git commit -m "Aggiornamento mappa Cartopy Lazio [skip ci]" || exit 0
          git push
