name: Aggiorna Mappe Meteo

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze di sistema e Python
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev
          python -m pip install --upgrade pip
          pip install requests numpy matplotlib cartopy
