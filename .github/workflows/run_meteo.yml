name: Aggiorna Mappe Meteo

on:
  schedule:
    - cron: '0 */3 * * *' # Gira ogni 3 ore in automatico
  workflow_dispatch: # Ti permette di farlo partire anche a mano con un click

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib

      - name: Esegui script generazione mappe
        run: python genera_mappe.py

      - name: Carica su Aruba via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: mappe_output/
          server-dir: /public_html/meteo/ # Modifica se vuoi metterlo in una cartella specifica del tuo sito
