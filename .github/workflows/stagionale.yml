name: Previsione stagionale
# Modello stagionale statistico (teleconnessioni, stratosfera, oceani) sull'Europa.
# Gli indici escono una volta al mese (nei primi giorni): lo rifaccio più volte al mese per prenderli appena escono.
on:
  schedule:
    - cron: '17 5 2,4,6,9,15,22 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stagionale
  cancel-in-progress: false
jobs:
  calcola:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements-mappe.txt
    - run: pip install -q -r requirements-mappe.txt xarray netCDF4
    - name: Coste e confini (memorizzati)
      uses: actions/cache@v4
      with:
        path: ~/.local/share/cartopy
        key: cartopy-naturalearth-v2
    - name: Recupero le previsioni già emesse (per la pagella)
      run: |
        mkdir -p pubblicato
        git fetch -q --depth 1 origin stagionale && git --work-tree=pubblicato checkout FETCH_HEAD -- . || echo "prima volta"
        git reset -q
    - name: Calcolo
      run: python -m motore.stagionale --out uscita_stagionale --archivio pubblicato
    - name: Pubblico nel ramo stagionale
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd uscita_stagionale
        git init -q -b stagionale
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -A
        git commit -q -m "Previsione stagionale $(date -u '+%Y-%m-%d') [skip ci]"
        git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" stagionale
        echo "::notice::Pubblicata: $(ls *.png | wc -l) mappe"
