name: EFI vapore acqueo
# EFI del vapore acqueo totale in colonna dall'ensemble ECMWF (corse delle 00 e delle 12).
on:
  schedule:
    - cron: '35 8,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: efi
  cancel-in-progress: false
jobs:
  efi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements-mappe.txt
    - run: pip install -q -r requirements-mappe.txt xarray netCDF4 eccodes
    - uses: actions/cache@v4
      with:
        path: ~/.local/share/cartopy
        key: cartopy-naturalearth-v2
    - name: Clima del vapore (solo la prima volta)
      run: |
        if [ ! -f dati/clima_tcwv.npz ]; then
          python -m motore.efi --clima dati/clima_tcwv.npz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dati/clima_tcwv.npz && git commit -q -m "Clima 1991-2020 del vapore acqueo per l'EFI" && \
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
        fi
    - run: python -m motore.efi --out uscita_efi
    - name: Pubblico nel ramo efi
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd uscita_efi
        git init -q -b efi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -A && git commit -q -m "EFI $(date -u '+%Y-%m-%d %H:%M')"
        git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" efi
