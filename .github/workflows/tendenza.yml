name: Tendenza per settimane e decadi
# Tendenza di temperatura e pioggia a Nerola per 6 settimane e 18 decadi, solo dagli indici di teleconnessione
# (NAO, AO, PNA, MJO, vortice polare, ENSO, QBO, ...) e dalla loro storia dal 1950 (motore/tendenza.py).
on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tendenza
  cancel-in-progress: false
jobs:
  calcola:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements-mappe.txt
    - run: pip install -q -r requirements-mappe.txt xarray netCDF4
    - name: Recupero la rianalisi gia' scaricata
      run: |
        mkdir -p pubblicato
        git fetch -q --depth 1 origin tendenza && git --work-tree=pubblicato checkout FETCH_HEAD -- . || echo "prima volta"
        git reset -q
    - name: Calcolo
      run: python -m motore.tendenza --out uscita_tendenza --archivio pubblicato
    - name: Pubblico nel ramo tendenza
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd uscita_tendenza
        git init -q -b tendenza
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -A
        git commit -q -m "Tendenza $(date -u '+%Y-%m-%d') [skip ci]"
        git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" tendenza
