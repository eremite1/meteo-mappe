name: Tendenza per settimane e decadi
# Tendenza di temperatura e pioggia sull'Europa per 6 settimane, 18 decadi e 3 mesi, solo dagli indici di teleconnessione
# (NAO, AO, PNA, MJO, vortice polare, ENSO, QBO, ...) e dalla loro storia dal 1950 (motore/tendenza.py).
on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tendenza
  cancel-in-progress: false
jobs:
  calcola:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements-mappe.txt
    - run: pip install -q -r requirements-mappe.txt xarray netCDF4
    - name: Coste e confini (memorizzati)
      uses: actions/cache@v4
      with:
        path: ~/.local/share/cartopy
        key: cartopy-naturalearth-v2
    - name: Rianalisi gia' scaricata (memorizzata)
      uses: actions/cache@v4
      with:
        path: cache_tendenza
        key: rianalisi-europa-${{ github.run_id }}
        restore-keys: rianalisi-europa-
    - name: Calcolo
      run: python -m motore.tendenza --out uscita_tendenza --cache cache_tendenza
    - name: Pubblico nel ramo tendenza
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd uscita_tendenza
        git init -q -b tendenza
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -A
        git commit -q -m "Tendenza $(date -u '+%Y-%m-%d') [skip ci]"
        git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" tendenza
