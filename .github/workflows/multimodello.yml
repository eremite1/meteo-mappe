name: Multimodello

# Media pesata dei modelli (pesi dalla pagella) su Lazio, Italia ed Europa: un lavoro per area, in parallelo.
# Parte dopo ogni elaborazione delle mappe e comunque ogni 6 ore; un'area si rifà solo se c'è una corsa nuova.
on:
  workflow_run:
    workflows: ["Mappe meteo"]
    types: [completed]
  schedule:
    - cron: '35 */6 * * *'
  workflow_dispatch:
    inputs:
      aree:
        description: 'Aree da elaborare (es. lazio,italia,europa)'
        default: 'lazio,italia,europa'
        required: true
      forza:
        description: 'Rielabora anche se le corse sono le stesse'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: multimodello
  cancel-in-progress: false

jobs:
  prepara:
    runs-on: ubuntu-latest
    outputs:
      aree: ${{ steps.a.outputs.aree }}
    steps:
    - id: a
      run: |
        A="${{ github.event.inputs.aree || 'lazio,italia,europa' }}"
        echo "aree=$(echo "$A" | tr -d ' ' | python3 -c 'import sys,json; print(json.dumps([x for x in sys.stdin.read().strip().split(",") if x]))')" >> "$GITHUB_OUTPUT"

  calcola:
    needs: prepara
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJson(needs.prepara.outputs.aree) }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements-mappe.txt
    - name: Installa
      run: pip install -q -r requirements-mappe.txt
    - name: Coste e confini (memorizzati tra un avvio e l'altro)
      uses: actions/cache@v4
      with:
        path: ~/.local/share/cartopy
        key: cartopy-naturalearth-v2
    - name: Calcola il multimodello
      env:
        FORZA: ${{ github.event.inputs.forza || 'false' }}
      run: |
        set +e
        python -m motore.multi ${{ matrix.area }} 2>&1 | tee registro.txt
        codice=${PIPESTATUS[0]}
        if [ $codice -ne 0 ]; then
          echo "::error::$(tail -c 3500 registro.txt | tr '\n' '|')"
          exit $codice
        fi
        grep -E "corsa|Istanti|Mappe disegnate|Fine|niente da fare|Valori nei punti" registro.txt | sed 's/^/::notice::/'
    - name: Consegna al passo di pubblicazione
      if: hashFiles('uscita/indice_parziale.json') != ''
      uses: actions/upload-artifact@v4
      with:
        name: multi-${{ matrix.area }}
        path: uscita/
        retention-days: 1
        compression-level: 0

  pubblica:
    needs: calcola
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -q numpy matplotlib
    - uses: actions/download-artifact@v4
      with:
        pattern: multi-*
        path: artefatti
    - name: Pubblica nel ramo mappe-multi
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        [ -d artefatti ] || { echo "Niente da pubblicare"; exit 0; }
        REMOTO="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
        BASE="$PWD"
        RAMO="$RUNNER_TEMP/ramo-multi"
        rm -rf "$RAMO" && mkdir -p "$RAMO" && cd "$RAMO"
        git init -q -b mappe-multi
        git config user.name 'actions-user'
        git config user.email 'actions@github.com'
        if git fetch -q --depth 1 "$REMOTO" mappe-multi 2>/dev/null; then
          git archive FETCH_HEAD | tar -x
        fi
        cd "$BASE"
        python -m motore.unisci "$RAMO" artefatti/multi-*
        cd "$RAMO"
        git add -A
        git commit -q -m "Multimodello $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
        git push -q -f "$REMOTO" mappe-multi
        echo "::notice::Pubblicato il multimodello: $(find . -name '*.png' | wc -l) mappe"
