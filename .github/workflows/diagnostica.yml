name: Diagnostica fonti dati
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Prove
      shell: python
      run: |
        import requests
        B = "https://meteohub.agenziaitaliameteo.it/api/"
        for d in ["MOLOCH", "MOLOCH_AIM", "ICON_2I_SURFACE_PRESSURE_LEVELS", "BOLAM"]:
            j = requests.get(B + "datasets/" + d + "/opendata", timeout=60).json()
            date = sorted({(x.get("date"), x.get("run")) for x in j})
            print(d, len(j), "piu' recenti:", date[-6:], "esempio:", j[-1] if j else None)
