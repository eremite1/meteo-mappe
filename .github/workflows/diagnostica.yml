name: Diagnostica fonti dati
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - run: pip install -q -r requirements-mappe.txt
    - name: Prove
      shell: python
      run: |
        import requests, json
        from motore import fonti
        for d in ["italia_meteo_arpae_icon_2i", "ncep_gfs025", "dwd_icon_eu", "ukmo_global_deterministic_10km"]:
            try:
                info = fonti.ultimo(d)
                f = fonti.FileOM(d, info, info["valid_times"][3])
                print("VARS", d, len(f.nomi), sorted(f.nomi))
                f.chiudi()
            except Exception as e:
                print("ERR", d, e)
        B = "https://meteohub.agenziaitaliameteo.it/api/datasets/"
        for d in ["ICON_2I_MODEL_LEVELS", "MOLOCH_AIM", "MOLOCH", "WRF", "BOLAM", "WRF_OL", "ICON_2I_RUC"]:
            r = requests.get(B + d + "/opendata", timeout=60)
            print("OD", d, r.status_code, r.text[:700])
        g = requests.get(B + "MOLOCH_AIM", timeout=60)
        print("INFO MOLOCH_AIM", g.status_code, g.text[:1500])
